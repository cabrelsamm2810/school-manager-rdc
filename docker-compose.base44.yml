name: school-manager-rdc

services:
  postgres:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: school
      POSTGRES_PASSWORD: schoolpass
      POSTGRES_DB: school
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school -d school"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Bucket S3 local pour le développement uniquement.
  # Cloudflare R2 est compatible S3 : le même code (lib/storage.ts) sert les deux.
  # Dès que les secrets S3_* (R2) sont fournis via /run/base44/app.env, ils
  # écrasent les valeurs de développement et l'app écrit dans le bucket R2.
  s3mock:
    image: adobe/s3mock:latest
    restart: on-failure
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: school-manager-rdc
      COM_ADOBE_TESTING_S3MOCK_STORE_REGION: us-east-1
    volumes:
      - s3mock_data:/s3mockroot
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9090"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  migrate:
    image: node:22-bookworm
    working_dir: /app
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://school:schoolpass@postgres:5432/school?schema=public
      DIRECT_URL: postgresql://school:schoolpass@postgres:5432/school?schema=public
    volumes:
      - .:/app:cached
    command:
      - sh
      - -ec
      - |
        npm install --no-audit --no-fund
        npx prisma generate
        npx prisma db push --accept-data-loss
        npx tsx prisma/seed.ts

  web:
    image: node:22-bookworm
    working_dir: /app
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      s3mock:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Ordre important : les valeurs de développement d'abord, les vrais secrets
    # (fournis par la plateforme) ensuite — le dernier env_file gagne.
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      DATABASE_URL: postgresql://school:schoolpass@postgres:5432/school?schema=public
      DIRECT_URL: postgresql://school:schoolpass@postgres:5432/school?schema=public
      SESSION_COOKIE_NAME: school_manager_session
      SESSION_MAX_AGE: "604800"
      NEXT_PUBLIC_APP_NAME: "School Manager RDC"
      NODE_ENV: development
      BASE44_PUBLIC_HOST_SUFFIX: ${BASE44_PUBLIC_HOST_SUFFIX:-}
    volumes:
      - .:/app:cached
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    command:
      - sh
      - -ec
      - |
        npm install --no-audit --no-fund
        npx prisma generate
        # Clear the Next dev build cache on start: the persistent /app/.next volume keeps
        # chunks left by an unclean shutdown or a production build, which surface as
        # 'Cannot find module ./NNNN.js' 500s on /_next/static/chunks/fallback/*.
        # .next is a mount point, so clear its contents, not the directory itself.
        find .next -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true
        exec npx next dev -H 0.0.0.0 -p 3000
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

volumes:
  postgres_data:
  s3mock_data:
